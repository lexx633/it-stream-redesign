<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Визуальный редактор · IT-Stream</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1e232c; --line:#2a313c;
    --text:#e7ebf0; --muted:#93a0b1; --accent:#5b8cff; --ok:#34d399; --err:#f87171;
    --bar-h:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text)}

  /* верхняя панель */
  .bar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:20;
    display:flex;align-items:center;gap:12px;padding:0 14px;
    background:rgba(14,17,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar .title{font-size:15px;font-weight:600;margin-right:6px;white-space:nowrap}
  .bar .hint{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{flex:1}
  .bar select{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
  button{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    border:0;border-radius:9px;padding:9px 16px;background:var(--accent);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:13px;white-space:nowrap}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)} .msg.wait{color:var(--muted)}

  /* область превью */
  .stage{position:absolute;top:var(--bar-h);left:0;right:0;bottom:0;background:#0a0c10}
  iframe{width:100%;height:100%;border:0;display:block;background:#fff}

  /* экран входа — перекрывает всё, пока пароль не подтверждён сервером */
  .login-gate{position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .login-gate.hidden{display:none}
  .login-box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .login-box h2{margin:0 0 18px;font-size:17px;font-weight:700}
  .login-box label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  .login-box input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:10px 12px;font-size:14px}
  .login-box input:focus{outline:none;border-color:var(--accent)}
  .login-box button{width:100%;margin-top:14px}
  .login-box .note{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.5;text-align:center}
  .login-msg{font-size:12.5px;color:var(--err);min-height:1.4em;margin-top:8px}

  /* панель настроек — используется только «Переменными» (vars-panel), сам пароль тут больше не живёт */
  .settings{position:fixed;top:var(--bar-h);right:0;width:360px;max-width:92vw;z-index:19;
    background:var(--panel);border-left:1px solid var(--line);border-bottom:1px solid var(--line);
    border-bottom-left-radius:14px;padding:16px 18px;transform:translateX(105%);transition:transform .25s;
    box-shadow:-14px 14px 40px rgba(0,0,0,.4)}
  .settings.open{transform:none}
  .settings h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
  .settings label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
  .settings input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:8px 10px;font-size:13px}
  .settings input:focus{outline:none;border-color:var(--accent)}
  .settings .key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#6b7686}
  .settings .note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}
  .row{display:flex;gap:8px}.row>div{flex:1}

  /* панель «Переменные» — во всю ширину, выпадает сверху, несколько колонок, скролл */
  .vars-panel{left:0;right:0;width:auto;max-width:none;
    border-left:0;border-right:0;border-bottom-left-radius:0;border-bottom-right-radius:0;
    max-height:calc(100vh - var(--bar-h));overflow-y:auto;
    transform:translateY(-110%)}
  .vars-panel .vars-grid{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 40px}
  .vars-panel .vars-group{flex:1 1 240px;max-width:300px;padding-bottom:8px}
  .vars-panel .vars-group h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);
    margin:18px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .vars-panel .vars-group:first-child h3{margin-top:0}
  .vars-panel .vars-grid label{margin:12px 0 5px}

  /* загрузка лого — внутри поля «Символ логотипа» */
  .logo-upload{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
  .logo-preview{width:34px;height:34px;border-radius:9px;object-fit:contain;background:var(--panel2);
    border:1px solid var(--line);padding:3px}
  .file-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;
    font-size:12px;font-weight:500;border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;cursor:pointer;color:var(--text);background:transparent}
  .file-btn:hover{border-color:var(--accent)}
  .file-btn input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer}
  .logo-clear{padding:7px 12px;font-size:12px}
  .logo-status{font-size:11px;color:var(--muted);flex-basis:100%}
  .logo-status.ok{color:var(--ok)} .logo-status.err{color:var(--err)}
</style>
</head>
<body>

<div class="bar">
  <span class="title">Редактор IT-Stream</span>
  <select id="pageSel"></select>
  <span class="hint" id="hint"></span>
  <span class="spacer"></span>
  <span id="msg" class="msg"></span>
  <button class="ghost" id="reload" type="button" title="Отменить несохранённые правки">Сбросить</button>
  <button class="ghost" id="vars" type="button" title="Телефон, почта, адрес, название — в одном месте">Переменные…</button>
  <button id="save" type="button" disabled>Сохранить</button>
  <button class="ghost" id="logout" type="button" title="Забыть пароль в этом браузере">Выйти</button>
</div>

<div class="stage"><iframe id="frame"></iframe></div>

<div class="login-gate" id="loginGate">
  <form class="login-box" id="loginForm">
    <h2>Вход в редактор</h2>
    <label>Пароль</label>
    <input id="loginPass" type="password" placeholder="пароль редактора" autocomplete="current-password" autofocus>
    <div class="login-msg" id="loginMsg"></div>
    <button type="submit">Войти</button>
  </form>
</div>

<script>
(function(){
  'use strict';

  // ---- страницы, доступные редактору ----
  // json:true — правка через content.json (структурная модель, добавление/удаление блоков).
  // json:false — статическая страница, правим текст прямо в HTML, сохраняем документ целиком.
  var PAGES = {
    'index':           {file:'index.html',         title:'Главная',       json:true},
    'it-outsourcing':  {file:'it-outsourcing.html', title:'ИТ-аутсорсинг', json:false},
    'skud':            {file:'skud.html',           title:'СКУД',          json:false},
    'sks':             {file:'sks.html',            title:'СКС',           json:false},
    'surveillance':    {file:'surveillance.html',    title:'Видеонаблюдение', json:false},
    'security':        {file:'security.html',        title:'ИТ-безопасность', json:false}
  };
  var qs = new URLSearchParams(location.search);
  // /skud/admin — mod_rewrite подставляет ?page=skud только на сервере,
  // в адресной строке браузера query-строки нет, поэтому дублируем разбор по pathname.
  var pathMatch = location.pathname.match(/^\/([a-z0-9_-]+)\/admin\/?$/i);
  var pageKey = qs.get('page') || (pathMatch ? pathMatch[1] : '') || 'index';
  if(!PAGES[pageKey]) pageKey = 'index';
  var PAGE = PAGES[pageKey];
  var isJson = PAGE.json;

  var frame = document.getElementById('frame');
  var els = {
    save:   document.getElementById('save'),
    reload: document.getElementById('reload'),
    logout: document.getElementById('logout'),
    vars:   document.getElementById('vars'),
    msg:    document.getElementById('msg'),
    hint:   document.getElementById('hint'),
    pageSel:document.getElementById('pageSel'),
    loginGate: document.getElementById('loginGate'),
    loginForm: document.getElementById('loginForm'),
    loginPass: document.getElementById('loginPass'),
    loginMsg:  document.getElementById('loginMsg')
  };
  var data = null;
  var ADMIN_PASS = ''; // подтверждённый сервером пароль текущей сессии — см. экран входа ниже

  // ---- переключатель страниц в шапке ----
  Object.keys(PAGES).forEach(function(k){
    var o = document.createElement('option');
    o.value = k; o.textContent = PAGES[k].title;
    if(k === pageKey) o.selected = true;
    els.pageSel.appendChild(o);
  });
  els.pageSel.addEventListener('change', function(){
    goToPage(els.pageSel.value);
  });
  function goToPage(key){
    if(key === pageKey) return;
    if(dirty && !confirm('Есть несохранённые правки. Перейти без сохранения?')) {
      els.pageSel.value = pageKey; return;
    }
    location.href = '/admin.html?page=' + key;
  }

  els.hint.textContent = isJson
    ? 'Кликните по любому тексту и правьте прямо на странице'
    : 'Статическая страница — правьте текст прямо на странице, ссылки меню переключают редактор';
  // admin.html физически лежит в корне сайта, но открывается и по «красивому»
  // адресу /skud/admin — относительные пути в этом случае резолвятся неверно,
  // поэтому все ссылки на соседние файлы делаем абсолютными от корня.
  frame.src = '/' + PAGE.file + '?_edit=1';

  function setMsg(t, cls){ els.msg.textContent = t || ''; els.msg.className = 'msg ' + (cls||''); }

  // ---- экран входа: пароль проверяется на сервере ДО того, как показать редактор ----
  // list-uploads.php ничего не меняет — им же удобно тихо проверить сохранённый пароль
  // при заходе, не отправляя реальных данных.
  function verifyPassword(pass, cb){
    fetch('/list-uploads.php', { method:'POST', body: JSON.stringify({pass: pass}) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){ cb(!!(res.ok && res.j && res.j.ok)); })
      .catch(function(){ cb(false); });
  }
  function showLoginGate(msg){
    els.loginGate.classList.remove('hidden');
    els.loginMsg.textContent = msg || '';
    els.loginPass.value = '';
    els.loginPass.focus();
  }
  function hideLoginGate(){ els.loginGate.classList.add('hidden'); }

  els.loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    var pass = els.loginPass.value.trim();
    if(!pass){ els.loginMsg.textContent = 'Введите пароль'; return; }
    els.loginMsg.textContent = '';
    verifyPassword(pass, function(ok){
      if(ok){
        ADMIN_PASS = pass;
        localStorage.setItem('itwin_pass', pass);
        hideLoginGate();
      } else {
        els.loginMsg.textContent = 'Неверный пароль';
        els.loginPass.value = ''; els.loginPass.focus();
      }
    });
  });
  els.logout.addEventListener('click', function(){
    localStorage.removeItem('itwin_pass');
    ADMIN_PASS = '';
    showLoginGate();
  });

  var savedPass = localStorage.getItem('itwin_pass') || '';
  if(savedPass){
    // сохранённому паролю доверяем сразу — без экрана входа при каждом переходе
    // между страницами (тут полный reload, см. goToPage). Проверяем в фоне молча;
    // гейт покажется только если пароль вдруг оказался неверным (сменили на сервере).
    ADMIN_PASS = savedPass;
    hideLoginGate();
    verifyPassword(savedPass, function(ok){
      if(!ok){ ADMIN_PASS = ''; localStorage.removeItem('itwin_pass'); showLoginGate(); }
    });
  } else {
    showLoginGate();
  }

  // ---- панель «Переменные» — общие для всех страниц (главная + подстраницы) ----
  // href:true — служебная ссылка при своём телефоне, в сортировке уходит под основные поля колонки.
  var VAR_GROUPS = [
    { g:'Название и бренд', items:[
      {p:'vars.company',               t:'Название компании'},
      {p:'vars.logo_mark',             t:'Символ логотипа'}
    ]},
    { g:'Контакты', items:[
      {p:'contacts.phone_free',        t:'Телефон (бесплатный)'},
      {p:'contacts.phone_free_href',   t:'  ↳ ссылка (tel:)', href:true},
      {p:'contacts.phone_support',     t:'Телефон (поддержка)'},
      {p:'contacts.phone_support_href',t:'  ↳ ссылка (tel:)', href:true},
      {p:'contacts.phone_sales',       t:'Телефон (продажи)'},
      {p:'contacts.phone_sales_href',  t:'  ↳ ссылка (tel:)', href:true},
      {p:'contacts.email',             t:'E-mail'} // ссылка mailto: считается из значения автоматически, отдельного поля нет
    ]},
    { g:'Адрес', items:[
      {p:'vars.address1',              t:'Адрес'},
      {p:'vars.office_label',          t:'Подпись адреса'}
    ]},
    { g:'Плейсхолдеры форм', items:[
      {p:'form.ph_name',               t:'Поле «Имя» (все формы)'},
      {p:'form.ph_phone',              t:'Поле «Телефон» (все формы)'},
      {p:'form.ph_email',              t:'Поле «E-mail» (все формы)'},
      {p:'form.ph_service',            t:'Текст «Интересует…» в списке услуг (все формы)'}
    ]}
  ];
  // в колонке — сперва основные поля (по алфавиту), служебные «↳ ссылка» — под ними (тоже по алфавиту)
  function sortedGroupItems(items){
    return items.slice().sort(function(a, b){
      var ah = a.href ? 1 : 0, bh = b.href ? 1 : 0;
      if(ah !== bh) return ah - bh;
      return a.t.localeCompare(b.t, 'ru');
    });
  }
  var varsPanel = null;
  function buildVarsPanel(){
    varsPanel = document.createElement('div');
    varsPanel.className = 'settings vars-panel';
    varsPanel.id = 'varsPanel';
    var h = '<h2>Переменные — правим в одном месте</h2><div class="vars-grid">';
    VAR_GROUPS.forEach(function(gr){
      h += '<div class="vars-group"><h3>'+gr.g+'</h3>';
      sortedGroupItems(gr.items).forEach(function(v){
        h += '<div class="field"><label>'+v.t+'</label><input data-vp="'+v.p+'" type="text"></div>';
        if(v.p === 'vars.logo_mark') h += LOGO_UPLOAD_HTML;
      });
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="note">Эти значения повторяются по всей странице (телефоны в шапке, контактах '+
         'и подвале; название — в логотипе и подвале). Правка здесь меняет их сразу везде.</div>';
    varsPanel.innerHTML = h;
    document.body.appendChild(varsPanel);
    Array.prototype.forEach.call(varsPanel.querySelectorAll('input[data-vp]'), function(inp){
      inp.addEventListener('input', function(){
        var p = inp.getAttribute('data-vp');
        setVal(p, inp.value);
        if(p === 'contacts.email'){
          var v = inp.value.trim();
          setVal('contacts.email_href', v ? 'mailto:' + v : '');
        }
        if(idoc && isJson) reRender(); // на статичных страницах live-рендера из data нет — увидит после сохранения
        varsDirty = true;
        markDirty();
      });
    });
    wireLogoUpload(varsPanel);
  }
  function toggleVarsPanel(){
    if(!varsPanel) buildVarsPanel();
    var open = varsPanel.classList.toggle('open');
    if(open && data){
      Array.prototype.forEach.call(varsPanel.querySelectorAll('input[data-vp]'), function(inp){
        var v = getVal(inp.getAttribute('data-vp'));
        inp.value = v == null ? '' : v;
      });
      refreshLogoPreview(varsPanel);
    }
  }
  els.vars.addEventListener('click', toggleVarsPanel);

  // ---- загрузка лого (картинкой) вместо символа ----
  var LOGO_UPLOAD_HTML =
    '<div class="logo-upload">' +
      '<img class="logo-preview" hidden alt="">' +
      '<label class="file-btn">Загрузить лого<input type="file" accept="image/png,image/jpeg,image/webp" id="logoFile"></label>' +
      '<button type="button" class="ghost logo-clear" id="logoClear" hidden>Очистить лого</button>' +
      '<span class="logo-status" id="logoStatus"></span>' +
    '</div>';
  function refreshLogoPreview(panel){
    var img = panel.querySelector('.logo-preview');
    var clearBtn = panel.querySelector('#logoClear');
    var symbolInput = panel.querySelector('input[data-vp="vars.logo_mark"]');
    if(!img || !data) return;
    var url = getVal('vars.logo_url');
    if(url){
      img.src = url; img.hidden = false;
      clearBtn.hidden = false;
      if(symbolInput) symbolInput.disabled = true;
    } else {
      img.hidden = true; img.removeAttribute('src');
      clearBtn.hidden = true;
      if(symbolInput) symbolInput.disabled = false;
    }
  }
  function wireLogoUpload(panel){
    var fileInput = panel.querySelector('#logoFile');
    var clearBtn = panel.querySelector('#logoClear');
    var status = panel.querySelector('#logoStatus');
    if(!fileInput) return;
    fileInput.addEventListener('change', function(){
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if(!file) return;
      if(file.size > 2 * 1024 * 1024){ status.textContent = 'Файл больше 2 МБ'; status.className = 'logo-status err'; return; }
      status.textContent = 'Загружаю…'; status.className = 'logo-status wait';
      var fd = new FormData();
      fd.append('pass', ADMIN_PASS);
      fd.append('file', file);
      fd.append('kind', 'logo');
      fetch('/upload-image.php', { method:'POST', body: fd })
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if(!res.ok || !res.j.ok) throw new Error((res.j && res.j.error) || 'ошибка загрузки');
          setVal('vars.logo_url', res.j.url);
          status.textContent = 'Загружено'; status.className = 'logo-status ok';
          refreshLogoPreview(panel);
          if(idoc && isJson) reRender();
          varsDirty = true;
          markDirty();
        })
        .catch(function(e){ status.textContent = 'Ошибка: ' + e.message; status.className = 'logo-status err'; });
    });
    if(clearBtn) clearBtn.addEventListener('click', function(){
      setVal('vars.logo_url', '');
      refreshLogoPreview(panel);
      if(idoc && isJson) reRender();
      varsDirty = true;
      markDirty();
      if(status){ status.textContent = ''; status.className = 'logo-status'; }
    });
  }

  // ---- доступ к значению по пути ("services.items.0.title") — только JSON-режим ----
  function splitPath(path){
    var parts = path.split('.');
    for(var n = parts.length; n >= 1; n--){
      var pref = parts.slice(0, n).join('.');
      if(Object.prototype.hasOwnProperty.call(data, pref)) return {root:pref, rest:parts.slice(n)};
    }
    return {root:parts[0], rest:parts.slice(1)};
  }
  function getVal(path){
    var s = splitPath(path), cur = data[s.root];
    for(var i=0;i<s.rest.length;i++){ if(cur==null) return undefined; cur = cur[s.rest[i]]; }
    return cur;
  }
  function setVal(path, val){
    var s = splitPath(path);
    if(!s.rest.length){ data[s.root] = val; return; }
    var cur = data[s.root];
    for(var i=0;i<s.rest.length-1;i++) cur = cur[s.rest[i]];
    cur[s.rest[s.rest.length-1]] = val;
  }

  // ---- шаблоны новых элементов по пути контейнера ----
  var ITEM_TPL = {
    'services.items': function(){ return {icon:'', title:'Новая услуга', desc:'Короткое описание услуги.', list:['Пункт списка']}; },
    'cases.items':    function(){ return {icon:'', title:'Новый кейс', desc:'Короткое описание кейса.', tags:['Тег']}; },
    'reviews.items':  function(){ return {rating:5, text:'Текст нового отзыва.', name:'Имя автора', role:'Компания', avatar:''}; },
    'faq.items':      function(){ return {q:'Новый вопрос?', a:'Ответ на вопрос.'}; },
    'nav.links':      function(){ return {label:'Пункт меню', href:'#'}; },
    'hero.card.rows': function(){ return {l:'Показатель', v:'значение'}; },
    'stats.items':    function(){ return {value:'100+', label:'подпись показателя'}; },
    'why.benefits':   function(){ return {num:'05', title:'Преимущество', text:'Короткое описание преимущества.'}; },
    'blog.posts':     function(){ return {tag:'Раздел', title:'Заголовок статьи', desc:'Короткое описание статьи.'}; },
    'footer.services':function(){ return {label:'Ссылка', href:'#services'}; },
    'footer.company': function(){ return {label:'Ссылка', href:'#'}; }
  };
  function newItemFor(listPath){
    if(ITEM_TPL[listPath]) return ITEM_TPL[listPath]();
    return '';                       // hero.chips, *.list, *.tags — массивы строк
  }

  // ================= редактор внутри iframe =================
  var idoc, iwin, ctl, ctlTarget = null;

  function reRender(){
    iwin.CMS.data = data;
    iwin.CMS.render();
    iwin.CMS.revealAll();
    enhance();
  }

  // всплывающая группа кнопок ◀ × ▶ над блоком — работает и с JSON-списками (главная),
  // и с raw-блоками на статичных страницах (data-raw-block-list, см. enhanceRawBlocks)
  function ensureCtl(){
    if(ctl) return;
    ctl = idoc.createElement('div');
    ctl.className = '__ed __ed-ctl';
    ctl.contentEditable = 'false';
    ctl.style.cssText = 'position:absolute;z-index:9999;display:none;gap:4px';
    function mkBtn(txt, title, cls){
      var b = idoc.createElement('button');
      b.type = 'button'; b.className = '__ed ' + cls; b.textContent = txt; b.title = title;
      b.style.cssText = 'width:26px;height:26px;line-height:1;font-size:15px;font-weight:700;'+
        'border:0;border-radius:50%;cursor:pointer;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0';
      b.addEventListener('mousedown', function(e){ e.preventDefault(); });
      return b;
    }
    var left = mkBtn('◀', 'Переместить влево', '__ed-move');
    var del  = mkBtn('×', 'Удалить блок', '__ed-del');
    var right= mkBtn('▶', 'Переместить вправо', '__ed-move');
    left.style.background = '#5b8cff'; right.style.background = '#5b8cff'; del.style.background = '#f87171';
    del.style.fontSize = '18px';
    function moveTarget(dir){
      if(!ctlTarget) return;
      var cont = ctlTarget.parentElement;
      if(cont.hasAttribute('data-raw-block-list')){
        var sib = siblingBlock(ctlTarget, dir);
        if(sib){
          if(dir < 0) cont.insertBefore(ctlTarget, sib); else cont.insertBefore(sib, ctlTarget);
          renumberIfNeeded(cont);
          markDirty();
        }
        hideCtl();
        return;
      }
      var listPath = cont.getAttribute('data-cms-list');
      var idx = itemIndex(ctlTarget);
      var arr = getVal(listPath);
      var j = idx + dir;
      if(Array.isArray(arr) && idx > -1 && j >= 0 && j < arr.length){
        var tmp = arr[idx]; arr[idx] = arr[j]; arr[j] = tmp;
        reRender();
      }
      hideCtl();
    }
    left.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); moveTarget(-1); });
    right.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); moveTarget(1); });
    del.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      if(!ctlTarget) return;
      var cont = ctlTarget.parentElement;
      if(cont.hasAttribute('data-raw-block-list')){
        if(iwin.confirm('Удалить этот блок?')){ ctlTarget.remove(); renumberIfNeeded(cont); markDirty(); }
        hideCtl();
        return;
      }
      var listPath = cont.getAttribute('data-cms-list');
      var idx = itemIndex(ctlTarget);
      var arr = getVal(listPath);
      if(Array.isArray(arr) && idx > -1){ arr.splice(idx, 1); reRender(); }
      hideCtl();
    });
    ctl.appendChild(left); ctl.appendChild(del); ctl.appendChild(right);
    ctl.style.display = 'none';
    idoc.body.appendChild(ctl);
  }
  function itemIndex(item){
    var kids = Array.prototype.filter.call(item.parentElement.children,
      function(c){ return !c.classList.contains('__ed'); });
    return kids.indexOf(item);
  }
  // ближайший «настоящий» (не служебный __ed) сосед блока в нужную сторону
  function siblingBlock(item, dir){
    var sib = dir < 0 ? item.previousElementSibling : item.nextElementSibling;
    while(sib && sib.classList.contains('__ed')) sib = dir < 0 ? sib.previousElementSibling : sib.nextElementSibling;
    return sib;
  }
  // для блоков с видимым номером (01/02/03…, напр. .ben-num, .step-num) — номер
  // должен идти по месту в списке, а не «уезжать» вместе с переставленным блоком
  function renumberIfNeeded(cont){
    var cfg = cont.__blockCfg;
    if(!cfg || !cfg.numSel) return;
    var items = Array.prototype.filter.call(cont.children, function(c){ return !c.classList.contains('__ed'); });
    items.forEach(function(it, i){
      var numEl = it.querySelector(cfg.numSel);
      if(numEl) numEl.textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
    });
  }
  // блоки идут строками сверху вниз (обычный поток / flex-column), а не карточками
  // слева направо (грид/flex-row) — тогда стрелки должны быть ▲/▼, а не ◀/▶
  function isVerticalList(cont){
    var cs = iwin.getComputedStyle(cont);
    if(cs.display === 'block' || cs.display === 'list-item') return true;
    if(cs.display.indexOf('flex') > -1 && cs.flexDirection.indexOf('column') > -1) return true;
    return false;
  }
  function showCtlFor(item){
    ensureCtl();
    ctlTarget = item;
    var cont = item.parentElement;
    var isRaw = cont.hasAttribute('data-raw-block-list');
    var canLeft, canRight;
    if(isRaw){
      canLeft = !!siblingBlock(item, -1);
      canRight = !!siblingBlock(item, 1);
    } else {
      var listPath = cont.getAttribute('data-cms-list');
      var arr = getVal(listPath);
      var idx = itemIndex(item);
      canLeft = idx > 0;
      canRight = Array.isArray(arr) && idx < arr.length - 1;
    }
    var kids = ctl.children; // [left, del, right]
    var vertical = isVerticalList(cont);
    kids[0].textContent = vertical ? '▲' : '◀';
    kids[0].title = vertical ? 'Переместить вверх' : 'Переместить влево';
    kids[2].textContent = vertical ? '▼' : '▶';
    kids[2].title = vertical ? 'Переместить вниз' : 'Переместить вправо';
    kids[0].disabled = !canLeft;
    kids[0].style.opacity = kids[0].disabled ? '.35' : '1';
    kids[0].style.cursor = kids[0].disabled ? 'default' : 'pointer';
    kids[2].disabled = !canRight;
    kids[2].style.opacity = kids[2].disabled ? '.35' : '1';
    kids[2].style.cursor = kids[2].disabled ? 'default' : 'pointer';
    var r = item.getBoundingClientRect();
    ctl.style.display = 'flex';
    var w = ctl.getBoundingClientRect().width;
    ctl.style.left = (iwin.scrollX + r.right - w) + 'px';
    ctl.style.top  = (iwin.scrollY + r.top  - 13) + 'px';
  }
  function hideCtl(){ if(ctl){ ctl.style.display = 'none'; } ctlTarget = null; }

  // ---- всплывающая кнопка «Цвет» при выделении текста — оборачивает выделенное
  // в <span class="grad"> (тот же градиентный акцент, что и «IT систем» на CTA).
  // Работает и в JSON-режиме (только data-cms-html поля — обычные data-cms хранят
  // чистый textContent, span там не переживёт сохранение), и в raw-режиме (там
  // сохраняется весь DOM целиком, span переживает без проблем в любом текстовом поле).
  var selToolbar = null, selToolbarTarget = null;
  function ensureSelToolbar(){
    if(selToolbar) return;
    selToolbar = idoc.createElement('button');
    selToolbar.type = 'button';
    selToolbar.className = '__ed __ed-color';
    selToolbar.contentEditable = 'false';
    selToolbar.title = 'Выделить градиентом (акцентный цвет)';
    selToolbar.textContent = '🎨 Цвет';
    selToolbar.style.cssText = 'position:absolute;z-index:9999;display:none;'+
      'padding:6px 14px;font-size:12px;font-weight:700;border:0;border-radius:8px;cursor:pointer;'+
      'background:linear-gradient(120deg,#22d3ee,#6366f1);color:#04121a;box-shadow:0 4px 14px rgba(0,0,0,.4);'+
      'white-space:nowrap';
    selToolbar.addEventListener('mousedown', function(e){ e.preventDefault(); });
    selToolbar.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      applyGradientToSelection();
    });
    idoc.body.appendChild(selToolbar);
  }
  function hideSelToolbar(){ if(selToolbar) selToolbar.style.display = 'none'; selToolbarTarget = null; }
  function applyGradientToSelection(){
    if(!selToolbarTarget) return;
    var sel = iwin.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed) return;
    var range = sel.getRangeAt(0);
    var anc = range.commonAncestorContainer;
    var host = anc.nodeType === 1 ? anc : anc.parentElement;
    var gradParent = host ? host.closest('.grad') : null;
    if(gradParent && selToolbarTarget.contains(gradParent) && range.toString().trim() === gradParent.textContent.trim()){
      // выделение = весь текст уже градиентного span — снимаем обёртку (toggle)
      var frag = idoc.createDocumentFragment();
      while(gradParent.firstChild) frag.appendChild(gradParent.firstChild);
      gradParent.parentNode.replaceChild(frag, gradParent);
    } else {
      var span = idoc.createElement('span');
      span.className = 'grad';
      var content = range.extractContents();
      span.appendChild(content);
      range.insertNode(span);
      sel.removeAllRanges();
      var nr = idoc.createRange();
      nr.selectNodeContents(span);
      sel.addRange(nr);
    }
    selToolbarTarget.dispatchEvent(new Event('input', {bubbles:true}));
    hideSelToolbar();
  }
  // matchSelector — какие поля считаются подходящими под кнопку (разное в JSON/raw режимах)
  function wireSelectionToolbar(matchSelector){
    idoc.addEventListener('mouseup', function(e){
      var host = e.target.closest ? e.target.closest(matchSelector) : null;
      if(!host) return;
      setTimeout(function(){
        var sel = iwin.getSelection();
        if(!sel || sel.isCollapsed || !sel.rangeCount){ hideSelToolbar(); return; }
        var range = sel.getRangeAt(0);
        if(!host.contains(range.commonAncestorContainer)){ hideSelToolbar(); return; }
        ensureSelToolbar();
        selToolbarTarget = host;
        var r = range.getBoundingClientRect();
        selToolbar.style.display = 'block';
        var w = selToolbar.getBoundingClientRect().width;
        selToolbar.style.left = (iwin.scrollX + r.left + r.width / 2 - w / 2) + 'px';
        selToolbar.style.top = (iwin.scrollY + r.top - 38) + 'px';
      }, 0);
    });
    idoc.addEventListener('mousedown', function(e){
      if(selToolbar && e.target !== selToolbar && !selToolbar.contains(e.target)) hideSelToolbar();
    });
  }

  function deletableFrom(node){
    var el = node;
    while(el && el !== idoc.body){
      var p = el.parentElement;
      if(p && p.getAttribute && !el.classList.contains('__ed') &&
         (p.getAttribute('data-cms-list') != null || p.hasAttribute('data-raw-block-list')))
        return el;
      el = p;
    }
    return null;
  }

  function iconNormKey(svgInner){

      'border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:13px';

        'background:var(--panel2);border:1px solid '+(iconNormKey(ic.svg)===curKey?'var(--accent)':'var(--line)')+';'+
        'border-radius:10px;cursor:pointer;padding:5px';

  // ---- медиатека: выбор уже загруженной картинки или загрузка новой (аватары отзывов и т.п.) ----
  function openMediaPicker(cur, cb){
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(6,8,12,.72);'+
      'display:flex;align-items:center;justify-content:center;padding:20px';
    var box = document.createElement('div');
    box.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:16px;'+
      'padding:20px;max-width:640px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)';
    box.innerHTML = '<h2 style="margin:0 0 4px;font-size:15px">Выберите картинку</h2>'+
      '<p style="margin:0 0 14px;font-size:12px;color:var(--muted)">Клик по картинке из уже загруженных — применить. Или загрузите новую.</p>';

    function close(){ if(ov.parentNode) document.body.removeChild(ov); }

    var uploadRow = document.createElement('div');
    uploadRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:14px';
    var fileLabel = document.createElement('label');
    fileLabel.style.cssText = 'position:relative;overflow:hidden;display:inline-flex;align-items:center;'+
      'font-size:13px;font-weight:600;color:#5b8cff;background:rgba(91,140,255,.10);'+
      'border:1px dashed #5b8cff;border-radius:9px;padding:9px 16px;cursor:pointer';
    fileLabel.textContent = 'Загрузить новую…';
    var fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = 'image/png,image/jpeg,image/webp';
    fileInput.style.cssText = 'position:absolute;inset:0;opacity:0;cursor:pointer';
    fileLabel.appendChild(fileInput);
    var status = document.createElement('span');
    status.style.cssText = 'font-size:12px;color:var(--muted)';
    uploadRow.appendChild(fileLabel); uploadRow.appendChild(status);
    box.appendChild(uploadRow);

    var grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(10,1fr);gap:6px;min-height:44px';
    grid.textContent = 'Загрузка списка…';
    grid.style.color = 'var(--muted)'; grid.style.fontSize = '12px';
    box.appendChild(grid);

    var urlRow = document.createElement('div');
    urlRow.style.cssText = 'display:flex;gap:8px;margin-top:16px';
    var urlInput = document.createElement('input');
    urlInput.type = 'text'; urlInput.placeholder = 'или вставьте ссылку на картинку'; urlInput.value = cur || '';
    urlInput.style.cssText = 'flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;'+
      'color:var(--text);padding:8px 10px;font-size:13px';
    var applyBtn = document.createElement('button');
    applyBtn.type = 'button'; applyBtn.textContent = 'Применить';
    applyBtn.addEventListener('click', function(){ var v = urlInput.value.trim(); if(v){ cb(v); close(); } });
    urlRow.appendChild(urlInput); urlRow.appendChild(applyBtn);
    box.appendChild(urlRow);

    var cancel = document.createElement('button');
    cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = 'Отмена';
    cancel.style.marginTop = '10px';
    cancel.addEventListener('click', close);
    box.appendChild(cancel);

    ov.appendChild(box);
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    document.body.appendChild(ov);

    function renderGrid(items){
      grid.innerHTML = ''; grid.style.color = ''; grid.style.fontSize = '';
      if(!items.length){
        grid.textContent = 'Пока ничего не загружено — загрузите первую картинку выше.';
        grid.style.color = 'var(--muted)'; grid.style.fontSize = '12px';
        return;
      }
      grid.style.display = 'grid';
      items.forEach(function(it){
        var b = document.createElement('button');
        b.type = 'button';
        b.style.cssText = 'aspect-ratio:1;padding:0;overflow:hidden;background:var(--panel2);'+
          'border:1px solid '+(it.url===cur?'var(--accent)':'var(--line)')+';border-radius:10px;cursor:pointer';
        var im = document.createElement('img');
        im.src = it.url; im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
        b.appendChild(im);
        b.addEventListener('click', function(){ cb(it.url); close(); });
        grid.appendChild(b);
      });
    }

    fetch('/list-uploads.php', { method:'POST', body: JSON.stringify({pass: ADMIN_PASS}) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        if(!res.ok || !res.j.ok) throw new Error((res.j && res.j.error) || 'ошибка');
        renderGrid(res.j.items || []);
      })
      .catch(function(e){ grid.textContent = 'Не удалось загрузить список: ' + e.message; });

    fileInput.addEventListener('change', function(){
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if(!file) return;
      if(file.size > 2 * 1024 * 1024){ status.textContent = 'Файл больше 2 МБ'; return; }
      status.textContent = 'Загружаю…';
      var fd = new FormData();
      fd.append('pass', ADMIN_PASS);
      fd.append('file', file);
      fd.append('kind', 'gallery');
      fetch('/upload-image.php', { method:'POST', body: fd })
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if(!res.ok || !res.j.ok) throw new Error((res.j && res.j.error) || 'ошибка загрузки');
          status.textContent = '';
          cb(res.j.url);
          close();
        })
        .catch(function(e){ status.textContent = 'Ошибка: ' + e.message; });
    });
  }

  // ================= JSON-режим (главная страница) =================
  function enhance(){
    if(!idoc.getElementById('__ed_style')){
      var st = idoc.createElement('style');
      st.id = '__ed_style';
      st.textContent =
        // background (не background-color) тут нельзя: часть текста на сайте — градиентная
        // (color:transparent + background-clip:text, напр. счётчики .stat b) — background
        // затирает background-image градиента и буквы визуально пропадают. background-color
        // сидит под градиентом и его не портит, а обводной outline и так виден на любом тексте.
        '[data-cms]{outline:1px dashed transparent;outline-offset:2px;transition:outline-color .1s,background-color .1s;border-radius:3px}'+
        '[data-cms]:hover{outline-color:#5b8cff;background-color:rgba(91,140,255,.10);cursor:text}'+
        '[data-cms]:focus{outline:2px solid #5b8cff;background-color:rgba(91,140,255,.14)}'+
        'img[data-cms-src]{outline:2px dashed transparent;outline-offset:2px;cursor:pointer}'+
        'img[data-cms-src]:hover{outline-color:#5b8cff}'+
        '[data-cms-icon]{outline:1px dashed transparent;outline-offset:3px;cursor:pointer;border-radius:8px}'+
        '[data-cms-icon]:hover{outline-color:#5b8cff;background:rgba(91,140,255,.10)}'+
        '[data-cms-rating]{cursor:pointer;border-radius:6px;outline:1px dashed transparent;outline-offset:3px}'+
        '[data-cms-rating]:hover{outline-color:#fbbf24}'+
        '.__ed-add{display:inline-flex;align-items:center;gap:6px;margin:10px auto 0;padding:8px 16px;'+
          'font:600 14px/1 inherit;color:#5b8cff;background:rgba(91,140,255,.10);'+
          'border:1px dashed #5b8cff;border-radius:10px;cursor:pointer}'+
        '.__ed-addwrap{width:100%;display:flex;justify-content:center;margin-top:8px}';
      idoc.head.appendChild(st);
    }

    Array.prototype.forEach.call(idoc.querySelectorAll('[data-cms]'), function(el){
      if(el.__edText) return;
      el.__edText = true;
      var path = el.getAttribute('data-cms');
      var isHtml = el.hasAttribute('data-cms-html');
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('spellcheck', 'false');
      el.addEventListener('input', function(){ setVal(path, isHtml ? el.innerHTML : el.textContent); markDirty(); });
      // Enter — перенос строки внутри поля (не отправка/не выход из редактирования).
      // Вставляем сам символ \n текстовым узлом, а не полагаемся на дефолтное поведение
      // браузера (в разных браузерах contenteditable на не-P элементе вставляет то <br>,
      // то новый <div> — оба варианта ломают textContent/сохранение). white-space:pre-line
      // на сайте (см. index.html) превращает \n в видимый перенос при показе.
      el.addEventListener('keydown', function(e){
        if(e.key !== 'Enter' || isHtml || el.tagName === 'P') return;
        e.preventDefault();
        var sel = iwin.getSelection();
        if(!sel || !sel.rangeCount) return;
        var range = sel.getRangeAt(0);
        range.deleteContents();
        var nl = idoc.createTextNode('\n');
        range.insertNode(nl);
        range.setStartAfter(nl);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        el.dispatchEvent(new Event('input', {bubbles:true}));
      });
    });

    Array.prototype.forEach.call(idoc.querySelectorAll('img[data-cms-src]'), function(img){
      if(img.__edImg) return;
      img.__edImg = true;
      img.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var path = img.getAttribute('data-cms-src');
        var cur = getVal(path) || '';
        openMediaPicker(cur, function(v){ setVal(path, v); img.src = v; markDirty(); });
      });
    });

    Array.prototype.forEach.call(idoc.querySelectorAll('[data-cms-list]'), function(cont){
      if(cont.querySelector(':scope > .__ed-addwrap')) return;
      var listPath = cont.getAttribute('data-cms-list');
      var wrap = idoc.createElement('div');
      wrap.className = '__ed __ed-addwrap';
      wrap.contentEditable = 'false';
      var b = idoc.createElement('button');
      b.type = 'button'; b.className = '__ed __ed-add';
      b.textContent = '＋ добавить';
      b.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var arr = getVal(listPath);
        if(!Array.isArray(arr)){ arr = []; setVal(listPath, arr); }
        arr.push(newItemFor(listPath));
        reRender(); markDirty();
      });
      wrap.appendChild(b);
      cont.appendChild(wrap);
    });

    Array.prototype.forEach.call(idoc.querySelectorAll('[data-cms-icon]'), function(box){
      if(box.__edIcon) return;
      box.__edIcon = true;
      box.title = 'Клик — выбрать иконку из набора';
      box.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var path = box.getAttribute('data-cms-icon');
        openIconPicker(getVal(path) || '', function(mk){ setVal(path, mk); reRender(); markDirty(); });
      });
    });

    Array.prototype.forEach.call(idoc.querySelectorAll('[data-cms-rating]'), function(box){
      if(box.__edRate) return;
      box.__edRate = true;
      box.title = 'Клик — рейтинг · левая половина звезды = половинка';
      box.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var path = box.getAttribute('data-cms-rating');
        var r = box.getBoundingClientRect();
        var starW = r.width / 5, idx = Math.floor((e.clientX - r.left) / starW);
        if(idx < 0) idx = 0; if(idx > 4) idx = 4;
        var frac = ((e.clientX - r.left) - idx * starW) / starW;
        setVal(path, idx + (frac <= 0.5 ? 0.5 : 1));
        reRender(); markDirty();
      });
    });

    Array.prototype.forEach.call(idoc.querySelectorAll('.q'), function(q){
      q.classList.add('open');
      var body = q.querySelector('.q-body');
      if(body) body.style.maxHeight = 'none';
    });

    if(!idoc.__selToolbarJson){ idoc.__selToolbarJson = true; wireSelectionToolbar('[data-cms-html]'); }
  }

  // ================= режим правки статических страниц =================
  // Нет JSON-модели — правим текст прямо в DOM через contenteditable и сохраняем
  // документ целиком. Селектор общий для всех внутренних страниц (единая разметка).
  var RAW_SEL = [
    'main h1', 'main h2', 'main h3', 'main h4',
    'main p', 'main li',
    'main .eyebrow', 'main .step-num',
    'main .case-tags span',
    'main .price-badge', 'main .cap', 'main .price-val', 'main .price-per',
    'main .rev-name',
    'main .contact-list .ci b', 'main .contact-list .ci span',
    '.foot-about p', '.foot-bottom span',
    // текст на кнопках — CTA-ссылки и «Подробнее» у кейсов (не только main:
    // всплывающие окна физически лежат вне <main>, рядом с footer)
    'main .btn', '.case-more',
    // текст внутри попапов (заявка, подробный кейс) — своя разметка, не в main
    '.lead-modal-overlay h3', '.lead-modal-overlay p', '.lead-modal-overlay .btn',
    '.case-modal-overlay h3', '.case-modal-overlay h4', '.case-modal-overlay p',
    '.case-modal-overlay li', '.case-modal-overlay .case-modal-tags span'
  ].join(',');

  // ---- карточные блоки на статичных страницах — добавление/удаление/порядок ----
  // Общий безопасный набор для всех 5 страниц (одна вёрстка/CSS-шаблон, см. TRACKS/decisions).
  // Селектор без совпадений на конкретной странице просто ничего не находит — вреда нет.
  // Сознательно не включены: .contact-list .ci (контакты в шапке — не «контентный» блок),
  // .steps-flow на surveillance.html (парный список с .steps-desc — реордер рассинхронит их).
  var RAW_BLOCK_SELECTORS = [
    {container: 'main .services',  item: '.svc', icon: '.svc-icon'},
    {container: 'main .benefits',  item: '.ben', numSel: '.ben-num'},
    {container: 'main .cases',     item: '.case', icon: '.case-ico'},
    {container: 'main .faq',       item: '.q'},
    {container: 'main .price',     item: '.price-card'},
    {container: 'main .spheres',   item: '.sphere'},
    {container: 'main .process',   item: '.step', numSel: '.step-num'},
    {container: 'main .choose-grid', item: '.ci', icon: '.ci-icon'},
    {container: 'main .reviews',   item: '.rev', img: '.rev-logo img'}
  ];

  function enhanceRaw(){
    if(!idoc.getElementById('__ed_style')){
      var st = idoc.createElement('style');
      st.id = '__ed_style';
      st.textContent =
        // см. комментарий у [data-cms] в enhance() — background-color, не background,
        // иначе градиентный текст (.grad и т.п.) визуально пропадает под подсветкой
        '[data-raw-edit]{outline:1px dashed transparent;outline-offset:2px;transition:outline-color .1s,background-color .1s;border-radius:3px}'+
        '[data-raw-edit]:hover{outline-color:#5b8cff;background-color:rgba(91,140,255,.10);cursor:text}'+
        '[data-raw-edit]:focus{outline:2px solid #5b8cff;background-color:rgba(91,140,255,.14)}'+
        '[data-raw-href]{outline:2px dashed transparent;outline-offset:2px;cursor:pointer}'+
        '[data-raw-href]:hover{outline-color:#fbbf24;background:rgba(251,191,36,.10)}'+
        '[data-raw-icon]{outline:1px dashed transparent;outline-offset:3px;cursor:pointer;border-radius:8px}'+
        '[data-raw-icon]:hover{outline-color:#5b8cff;background:rgba(91,140,255,.10)}'+
        '.__ed-add{display:inline-flex;align-items:center;gap:6px;margin:10px auto 0;padding:8px 16px;'+
          'font:600 14px/1 inherit;color:#5b8cff;background:rgba(91,140,255,.10);'+
          'border:1px dashed #5b8cff;border-radius:10px;cursor:pointer}'+
        '.__ed-addwrap{width:100%;display:flex;justify-content:center;margin-top:8px}';
      idoc.head.appendChild(st);
    }

    Array.prototype.forEach.call(idoc.querySelectorAll(RAW_SEL), function(el){

      el.__edText = true;
      el.setAttribute('data-raw-edit', '1');
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('spellcheck', 'false');
      el.addEventListener('input', markDirty);
    });

    // телефон/почта внутри контента — правка ссылки по клику (кроме шапки/подвала)
    Array.prototype.forEach.call(idoc.querySelectorAll('main a[href^="tel:"],main a[href^="mailto:"]'), function(a){
      if(a.__edHref) return;
      a.__edHref = true;
      a.setAttribute('data-raw-href', '1');
      a.title = 'Клик — изменить ссылку';
      a.addEventListener('click', function(e){
        e.preventDefault(); e.stopPropagation();
        var cur = a.getAttribute('href') || '';
        var v = iwin.prompt('Ссылка (tel:.../mailto:...):', cur);
        if(v != null && v.trim()){ a.setAttribute('href', v.trim()); markDirty(); }
      });
    });

    enhanceRawBlocks();

    if(!idoc.__selToolbarRaw){ idoc.__selToolbarRaw = true; wireSelectionToolbar('[data-raw-edit]'); }
  }

  // «+ добавить» под каждым карточным контейнером; сами карточки помечаем
  // data-raw-block-list на контейнере — дальше их подхватывают общие
  // ensureCtl/showCtlFor/deletableFrom (те же ◀ × ▶, что и в JSON-режиме).
  function wireRawIcon(iconBox){
    if(iconBox.__rawIcon) return;
    iconBox.__rawIcon = true;
    iconBox.setAttribute('data-raw-icon', '1');
    iconBox.title = 'Клик — выбрать иконку из набора';
    iconBox.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      var svg = iconBox.querySelector('svg');
      var cur = svg ? svg.innerHTML.trim() : '';
      openIconPicker(cur, function(mk){
        if(!svg){
          svg = idoc.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 24 24');
          iconBox.appendChild(svg);
        }
        svg.innerHTML = mk;
        markDirty();
      });
    });
  }
  function wireRawImg(img){
    if(img.__rawImg) return;
    img.__rawImg = true;
    img.title = 'Клик — выбрать/загрузить картинку';
    img.style.cursor = 'pointer';
    img.addEventListener('click', function(e){
      e.preventDefault(); e.stopPropagation();
      openMediaPicker(img.getAttribute('src') || '', function(v){
        img.setAttribute('src', v);
        markDirty();
      });
    });
  }
  function enhanceRawBlocks(){
    RAW_BLOCK_SELECTORS.forEach(function(cfg){
      Array.prototype.forEach.call(idoc.querySelectorAll(cfg.container), function(cont){
        cont.setAttribute('data-raw-block-list', '1');
        cont.__blockCfg = cfg;
        if(cfg.icon){
          Array.prototype.forEach.call(cont.querySelectorAll(':scope > ' + cfg.item + ' ' + cfg.icon), wireRawIcon);
        }
        if(cfg.img){
          Array.prototype.forEach.call(cont.querySelectorAll(':scope > ' + cfg.item + ' ' + cfg.img), wireRawImg);
        }
        if(cont.querySelector(':scope > .__ed-addwrap')) return; // уже подключено
        var wrap = idoc.createElement('div');
        wrap.className = '__ed __ed-addwrap';
        wrap.contentEditable = 'false';
        var b = idoc.createElement('button');
        b.type = 'button'; b.className = '__ed __ed-add';
        b.textContent = '＋ добавить';
        b.addEventListener('click', function(e){
          e.preventDefault(); e.stopPropagation();
          var items = Array.prototype.filter.call(cont.children, function(c){
            return !c.classList.contains('__ed') && c.matches(cfg.item);
          });
          if(!items.length) return; // пустой контейнер — клонировать нечего
          var clone = items[items.length - 1].cloneNode(true);
          // новый блок — не дублируем иконку исходного, пусть выберут свою
          if(cfg.icon){
            var iconBox = clone.querySelector(cfg.icon);
            var svg = iconBox && iconBox.querySelector('svg');
            if(svg) svg.innerHTML = '';
          }
          if(cfg.img){
            var clonedImg = clone.querySelector(cfg.img);
            if(clonedImg) clonedImg.removeAttribute('src');
          }
          cont.insertBefore(clone, wrap);
          renumberIfNeeded(cont);
          enhanceRaw(); // подключить contenteditable/ссылки/иконку у склонированного блока
          markDirty();
        });
        wrap.appendChild(b);
        cont.appendChild(wrap);
      });
    });
  }

  // ---- переход на другую страницу по клику на пункт меню внутри iframe ----
  function pageKeyFromHref(href){
    if(!href) return null;
    href = href.trim();
    if(href === '/' || href === '') return 'index';
    var m = href.match(/^\/([a-z0-9_-]+)\/?$/i);
    if(!m) return null;
    var k = m[1].toLowerCase();
    return PAGES[k] ? k : null;
  }

  // ---- ставим редактор поверх загруженного iframe ----
  function installEditor(){
    iwin = frame.contentWindow;
    idoc = frame.contentDocument;

    idoc.addEventListener('click', function(e){
      var t = e.target;
      if(t.closest && t.closest('.__ed, [data-raw-href]')) return; // свои контролы

      // «безопасные» интерактивные элементы — не уводят со страницы и не шлют
      // форму (кнопка вне <form>, либо явно type=button, либо CTA-ссылка на
      // #contacts — её же обработчик сам делает preventDefault), поэтому в
      // редакторе им не мешаем: попап/аккордеон должны открываться, чтобы
      // можно было увидеть и поправить текст внутри
      var btn = t.closest ? t.closest('button') : null;
      var safeButton = btn && (!btn.closest('form') || btn.type === 'button');
      var safeCta = t.closest && t.closest('a.btn[href="#contacts"]');
      var overlayBg = t.classList && (t.classList.contains('lead-modal-overlay') || t.classList.contains('case-modal-overlay'));
      if(safeButton || safeCta || overlayBg) return;

      var a = t.closest ? t.closest('a,button') : null;
      if(!a) return;

      // карточка сама целиком <a href="..."> (напр. services.items ведущие сразу
      // на другую страницу), а кликнули по иконке/тексту ВНУТРИ неё — отдаём клик
      // собственному обработчику поля (иконка/текст), а не переходу по ссылке.
      // Если data-cms сам и есть эта ссылка (напр. пункт меню nav.links) — это
      // НЕ тот случай, переход по страницам админки должен работать как раньше.
      var editable = t.closest ? t.closest('[data-cms],[data-cms-icon],[data-cms-src],[data-cms-rating],[data-raw-edit],[data-raw-icon]') : null;
      if(editable && editable !== a && a.contains(editable)) return;
      if(a.tagName === 'A'){
        var key = pageKeyFromHref(a.getAttribute('href'));
        if(key && key !== pageKey){
          e.preventDefault(); e.stopPropagation();
          els.pageSel.value = key;
          goToPage(key);
          return;
        }
      }
      e.preventDefault(); e.stopPropagation();
    }, true);
    idoc.addEventListener('submit', function(e){ e.preventDefault(); }, true);

    idoc.addEventListener('mouseover', function(e){
      var item = deletableFrom(e.target);
      if(item) showCtlFor(item);
    });
    idoc.addEventListener('mouseout', function(e){
      if(!e.relatedTarget || (!(ctl && ctl.contains(e.relatedTarget)) && !deletableFrom(e.relatedTarget))) hideCtl();
    });
    iwin.addEventListener('scroll', hideCtl, {passive:true});

    if(isJson){
      iwin.CMS.data = data;
      iwin.CMS.render();
      iwin.CMS.revealAll();
      enhance();
    } else {
      enhanceRaw();
    }

    els.save.disabled = false;
    setMsg('Готово к правке', 'wait');
  }

  var dirty = false;
  var varsDirty = false; // «Переменные» правят content.json — сохраняются отдельным вызовом save.php
  function markDirty(){ if(!dirty){ dirty = true; setMsg('Есть несохранённые правки', 'wait'); } }

  function whenFrameReady(cb){
    if(!isJson){ cb(); return; } // статические страницы ничего асинхронно не грузят
    var w = frame.contentWindow;
    if(w && w.CMS && w.__cmsReady){ cb(); return; }
    var iv = setInterval(function(){
      var w = frame.contentWindow;
      if(w && w.CMS && w.__cmsReady){ clearInterval(iv); cb(); }
    }, 120);
    setTimeout(function(){ clearInterval(iv); }, 8000);
  }

  function boot(){
    // content.json грузим всегда: на JSON-странице это модель всего контента,
    // на статичных страницах — источник общих переменных («Переменные…»,
    // напр. плейсхолдеры полей форм), которые правятся разом на всех страницах
    fetch('/content.json?_=' + Date.now(), {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('content.json ' + r.status); return r.json(); })
      .then(function(j){ data = j; whenFrameReady(installEditor); })
      .catch(function(e){
        if(isJson){ setMsg('Не удалось загрузить content.json: ' + e.message, 'err'); return; }
        // статичная страница может работать и без общих переменных
        data = {}; whenFrameReady(installEditor);
      });
  }
  frame.addEventListener('load', boot);

  els.reload.addEventListener('click', function(){
    dirty = false; setMsg('');
    els.save.disabled = true;
    frame.src = '/' + PAGE.file + '?_edit=1&_=' + Date.now();
  });

  // раздельная копия документа без служебной разметки редактора (contenteditable,
  // data-raw-edit/-href, инжектированный <style id="__ed_style">) — иначе она
  // улетает в сохранённый файл и видна всем посетителям страницы.
  function cleanHtmlForSave(){
    var clone = idoc.documentElement.cloneNode(true);
    var st = clone.querySelector('#__ed_style');
    if(st) st.parentNode.removeChild(st);
    // служебные элементы редактора (кнопка «+ добавить», всплывающие ◀ × ▶) —
    // никогда не должны попасть в сохранённый файл
    Array.prototype.forEach.call(clone.querySelectorAll('.__ed'), function(el){
      if(el.parentNode) el.parentNode.removeChild(el);
    });
    Array.prototype.forEach.call(clone.querySelectorAll('[data-raw-block-list]'), function(el){
      el.removeAttribute('data-raw-block-list');
    });
    Array.prototype.forEach.call(clone.querySelectorAll('[data-raw-edit]'), function(el){
      el.removeAttribute('data-raw-edit');
      el.removeAttribute('contenteditable');
      el.removeAttribute('spellcheck');
    });
    Array.prototype.forEach.call(clone.querySelectorAll('[data-raw-href]'), function(el){
      el.removeAttribute('data-raw-href');
      el.removeAttribute('title');
    });
    Array.prototype.forEach.call(clone.querySelectorAll('[data-raw-icon]'), function(el){
      el.removeAttribute('data-raw-icon');
      el.removeAttribute('title');
    });
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  // ================= сохранение через save.php =================
  function postSave(body){
    return fetch('/save.php', { method: 'POST', body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; }); })
      .then(function(res){
        if(!res.ok || !res.j.ok) throw new Error((res.j && res.j.error) || ('HTTP ' + res.status));
      });
  }

  els.save.addEventListener('click', function(){
    if(!ADMIN_PASS){ setMsg('Сессия истекла — войдите заново', 'err'); showLoginGate(); return; }
    var pass = ADMIN_PASS;
    els.save.disabled = true; setMsg('Сохраняю…', 'wait');

    var jobs = [];
    if(isJson){
      jobs.push(postSave({ pass: pass, data: data }));
    } else {
      // на статичной странице текст документа и общие переменные (content.json)
      // сохраняются отдельными вызовами — форматы у save.php разные (html vs data)
      jobs.push(postSave({ pass: pass, page: PAGE.file, html: cleanHtmlForSave() }));
      if(varsDirty) jobs.push(postSave({ pass: pass, data: data }));
    }
    Promise.all(jobs)
      .then(function(){
        dirty = false; varsDirty = false;
        setMsg('Сохранено', 'ok');
        els.save.disabled = false;
      }).catch(function(e){
        setMsg('Ошибка: ' + e.message, 'err');
        els.save.disabled = false;
      });
  });

  window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
